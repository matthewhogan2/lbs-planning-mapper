services:
  db:
    image: postgis/postgis:16-3.4
    container_name: lbs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data      # data survives restarts
    networks:
      lbs_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    container_name: lbs_web
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app                        # live code reload in dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      lbs_net:
        ipv4_address: 172.28.0.20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: lbs_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      lbs_net:
        ipv4_address: 172.28.0.30

networks:
  lbs_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16             # custom subnet (rubric requirement)

volumes:
  pgdata:
  pgadmin_data:
