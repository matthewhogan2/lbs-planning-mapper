{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning Mapper</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{% static 'planning/map.css' %}">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Planning Mapper</span>
    {% if user.is_authenticated %}
      <span class="text-light small">Logged in as {{ user.username }}</span>
    {% else %}
      <a class="btn btn-outline-light btn-sm" href="/api-auth/login/?next=/">Log in</a>
    {% endif %}
  </nav>

  <div class="app">
    <aside class="sidebar p-3" aria-label="Map tools">
      <h2 class="h6 text-muted">Spatial queries</h2>
      <p class="small text-muted">Pick a tool, then click the map to supply the point.</p>

      <form id="nearest-form" class="mb-3">
        <label class="form-label small mb-1">Nearest applications</label>
        <div class="input-group input-group-sm mb-2">
          <span class="input-group-text">N</span>
          <input type="number" id="nearest-n" class="form-control" value="10" min="1" max="100">
        </div>
       
        <button type="submit" class="btn btn-sm btn-primary w-100">Find nearest (click map)</button>
      </form>

      <form id="within-form" class="mb-3">
        <label class="form-label small mb-1">Within radius</label>
        <div class="input-group input-group-sm mb-2">
          <span class="input-group-text">km</span>
          <input type="number" id="within-km" class="form-control" value="2" min="0.1" max="50" step="0.1">
        </div>
        <button type="submit" class="btn btn-sm btn-primary w-100">Search radius (click map)</button>
      </form>

      
      <form id="locate-form" class="mb-3">
        <label class="form-label small mb-1">Which county is this?</label>
        <button type="submit" class="btn btn-sm btn-primary w-100">Locate county (click map)</button>
      </form>

      <button id="clear-results" type="button" class="btn btn-sm btn-outline-secondary w-100 mb-3">Clear results</button>

      <p id="query-status" class="small text-muted" aria-live="polite"></p>
    </aside>
    <main id="map" aria-label="Map of planning applications"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{% static 'planning/map.js' %}"></script>
</body>
</html>
