{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning Mapper</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{% static 'planning/map.css' %}">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Planning Mapper</span>
    {% if user.is_authenticated %}
      <span class="text-light small">Logged in as {{ user.username }}</span>
    {% else %}
      <a class="btn btn-outline-light btn-sm" href="/api-auth/login/?next=/">Log in</a>
    {% endif %}
  </nav>

  <div class="app">
    <aside class="sidebar p-3" aria-label="Map tools">
      <h2 class="h6 text-muted">Spatial queries</h2>
      <p class="small text-muted">Tools coming in step 3.</p>
    </aside>
    <main id="map" aria-label="Map of planning applications"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{% static 'planning/map.js' %}"></script>
</body>
</html>
